agent:
  id: roi-snips
  name: Roi Snips
  mode: CATALYST_CONTINUATION_LONG_PLAYBOOK_V2
  strategy_family: CatalystContinuationLong
  trigger_whitelist: [OPENING_DRIVE_LONG, ORB_BREAK, VWAP_RECLAIM]
  enabled_modes:
    - OPENING_DRIVE_LONG
    - ORB_BREAK
    - VWAP_RECLAIM

market:
  scope: US_STOCKS_ETFS_LONG_ONLY
  broker: ALPACA
  data: ALPACA_MARKET_DATA
  account_assumption: LIVE_CASHLIKE_UNDER_2K
  intraday_only: true
  long_only: true

execution:
  approval_required: false
  live_direct_trading_allowed_when_armed: true
  max_open_positions: 1
  entry_window_et:
    start: "09:30:00"
    end: "11:00:00"
  opening_drive_window_et:
    start: "09:30:00"
    end: "09:34:59"
  force_flat_all_et: "15:45:00"

models:
  research_model: openai-codex/gpt-5.5
  escalation_model: openai-codex/gpt-5.5
